# Long fuzz runs: weekly, plus on demand. Never blocks pushes or PRs.
# Each target runs on Linux x86_64 with its corpus restored from the
# previous run (actions/cache), so runs build on each other; the committed
# seeds in fuzz/seeds/ are always included as the baseline. A crash fails
# the job, uploads the crashing input, and opens an issue.
name: Fuzz (long)

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per target
        default: "30"
        required: true

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: package, max_len: "16384" }
          - { target: model_json, max_len: "16384" }
          - { target: texture_png, max_len: "65536" }
          - { target: inp_container, max_len: "65536" }
          - { target: inp_json, max_len: "16384" }
          - { target: tga, max_len: "65536" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # A new key every run saves the grown corpus; restore picks the
          # most recent one.
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        id: fuzz
        env:
          MINUTES: ${{ inputs.minutes || '30' }}
        run: |
          set -o pipefail
          [[ "$MINUTES" =~ ^[0-9]+$ ]] || { echo "minutes must be a number"; exit 2; }
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- \
            -max_total_time=$((MINUTES * 60)) -timeout=10 -rss_limit_mb=2048 \
            -max_len=${{ matrix.max_len }} 2>&1 | tail -n 200
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
      - name: Open an issue
        if: failure() && steps.fuzz.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Fuzz crash: ${{ matrix.target }} (run ${{ github.run_id }})" \
            --body "The long fuzz run found a crash in \`${{ matrix.target }}\`.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          The crashing input is in the \`fuzz-crash-${{ matrix.target }}\` artifact.

          Per CLAUDE.md, the input becomes a regression test in
          \`tests/regressions/${{ matrix.target }}/\` together with the fix."
