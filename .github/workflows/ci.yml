name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and arm64 on every platform. Linux is pinned to 24.04
        # (ubuntu-latest is moving to 26.04) so Mesa stays fixed for the
        # M2 render tests. macos-15-intel is GitHub's last Intel image,
        # announced as available until about August 2027.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      # Linux renders on lavapipe, the golden reference, and render tests
      # are REQUIRED there: a missing adapter fails the job, so skipping can
      # never silently hide every render test. Elsewhere render tests use
      # whatever adapter exists (Metal, WARP) or report SKIPPED.
      RIGLET_REQUIRE_GPU: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '0' }}
      WGPU_BACKEND: ${{ startsWith(matrix.os, 'ubuntu') && 'vulkan' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is preinstalled on every hosted runner; with no arguments it
      # installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install lavapipe
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee tests.log
      # Worst-case mesh-deformer binding must be rejected fast in release.
      - run: cargo test --release -p riglet-format --test binding -- --ignored
      - name: Report render adapter
        if: always()
        shell: bash
        run: |
          line=$(grep -m1 -E 'render tests: (adapter|SKIPPED)' tests.log 2>/dev/null || echo 'render tests: did not run')
          cli=$(grep -c 'cli render tests: SKIPPED' tests.log 2>/dev/null || true)
          echo "${{ matrix.os }}: $line (CLI render tests skipped: ${cli:-0})"
          echo "- **${{ matrix.os }}**: ${line#render tests: } (CLI render tests skipped: ${cli:-0})" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload golden mismatches
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-failures-${{ matrix.os }}
          path: target/tmp/render-failures/
          if-no-files-found: ignore

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly check --manifest-path fuzz/Cargo.toml
      - run: cargo +nightly fuzz run package fuzz/seeds/package -- -max_total_time=60 -timeout=10 -max_len=16384
      - run: cargo +nightly fuzz run model_json fuzz/seeds/model_json -- -max_total_time=60 -timeout=10 -max_len=16384
      - run: cargo +nightly fuzz run texture_png fuzz/seeds/texture_png -- -max_total_time=60 -timeout=10 -max_len=65536 -rss_limit_mb=2048
