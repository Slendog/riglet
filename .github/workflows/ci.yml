name: CI

on:
  push:
    # goldens/<timestamp>-<sha> branches are temporary snapshots pushed by
    # scripts/update-goldens.sh for the "Update goldens" workflow; they lack
    # the new goldens by design, so CI on them would always fail.
    branches-ignore:
      - "goldens/**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and arm64 on every platform. Linux is pinned to 24.04
        # (ubuntu-latest is moving to 26.04) so Mesa stays fixed for the
        # render tests. macos-15-intel is GitHub's last Intel image,
        # announced as available until about August 2027.
        #
        # backend/adapter: what the render tests MUST run on; anything else
        # (including a silent fallback to GL) fails. allow_skip: render
        # tests may skip for lack of an adapter. The allow-list is EMPTY;
        # an entry needs a justification in CLAUDE.md.
        #
        # The gl entry renders through Mesa's GL (llvmpipe via EGL) with
        # wgpu's WebGL2 downlevel limits, so the GL backend and the 2048 px
        # texture limit a browser build gets are exercised for real.
        include:
          - { label: ubuntu-24.04, os: ubuntu-24.04, wgpu_backend: vulkan, backend: Vulkan, adapter: llvmpipe, limits: adapter, allow_skip: false }
          - { label: ubuntu-24.04-gl-webgl2, os: ubuntu-24.04, wgpu_backend: gl, backend: Gl, adapter: llvmpipe, limits: webgl2, allow_skip: false }
          - { label: ubuntu-24.04-arm, os: ubuntu-24.04-arm, wgpu_backend: vulkan, backend: Vulkan, adapter: llvmpipe, limits: adapter, allow_skip: false }
          - { label: macos-latest, os: macos-latest, wgpu_backend: "", backend: Metal, adapter: "", limits: adapter, allow_skip: false }
          - { label: macos-15-intel, os: macos-15-intel, wgpu_backend: "", backend: Metal, adapter: "", limits: adapter, allow_skip: false }
          - { label: windows-latest, os: windows-latest, wgpu_backend: "", backend: Dx12, adapter: Microsoft Basic Render Driver, limits: adapter, allow_skip: false }
          - { label: windows-11-arm, os: windows-11-arm, wgpu_backend: "", backend: Dx12, adapter: Microsoft Basic Render Driver, limits: adapter, allow_skip: false }
    runs-on: ${{ matrix.os }}
    env:
      RIGLET_REQUIRE_GPU: ${{ matrix.allow_skip && '0' || '1' }}
      RIGLET_EXPECT_BACKEND: ${{ matrix.backend }}
      RIGLET_EXPECT_ADAPTER: ${{ matrix.adapter }}
      RIGLET_DEVICE_LIMITS: ${{ matrix.limits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is preinstalled on every hosted runner; with no arguments it
      # installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Mesa (lavapipe, llvmpipe GL/EGL)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers libegl1 libegl-mesa0 libgl1-mesa-dri libgles2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          # WGPU_BACKEND only where the matrix names one (vulkan, gl);
          # elsewhere it stays UNSET: an empty value means "no backends".
          if [ -n "${{ matrix.wgpu_backend }}" ]; then export WGPU_BACKEND="${{ matrix.wgpu_backend }}"; fi
          cargo test --workspace -- --nocapture 2>&1 | tee tests.log
      # Worst-case mesh-deformer binding must be rejected fast in release.
      - run: cargo test --release -p riglet-format --test binding -- --ignored
      - name: Report render adapter
        if: always()
        shell: bash
        run: |
          line=$(grep -v 'cli render tests' tests.log 2>/dev/null | grep -m1 -E 'render tests: (adapter|SKIPPED)' || echo 'render tests: did not run')
          cli=$(grep -c 'cli render tests: SKIPPED' tests.log 2>/dev/null || true)
          echo "${{ matrix.label }}: ${line#*render tests: } (expected ${{ matrix.backend }} ${{ matrix.adapter }}; CLI render tests skipped: ${cli:-0})"
          echo "- **${{ matrix.label }}**: ${line#*render tests: } (expected ${{ matrix.backend }} ${{ matrix.adapter }}; CLI render tests skipped: ${cli:-0})" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload golden mismatches
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-failures-${{ matrix.label }}
          path: target/tmp/render-failures/
          if-no-files-found: ignore

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly check --manifest-path fuzz/Cargo.toml
      - run: cargo +nightly fuzz run package fuzz/seeds/package -- -max_total_time=60 -timeout=10 -max_len=16384
      - run: cargo +nightly fuzz run model_json fuzz/seeds/model_json -- -max_total_time=60 -timeout=10 -max_len=16384
      - run: cargo +nightly fuzz run texture_png fuzz/seeds/texture_png -- -max_total_time=60 -timeout=10 -max_len=65536 -rss_limit_mb=2048
      - run: cargo +nightly fuzz run inp_container fuzz/seeds/inp_container -- -max_total_time=60 -timeout=10 -max_len=65536 -rss_limit_mb=2048
      - run: cargo +nightly fuzz run inp_json fuzz/seeds/inp_json -- -max_total_time=60 -timeout=10 -max_len=16384 -rss_limit_mb=2048
      - run: cargo +nightly fuzz run tga fuzz/seeds/tga -- -max_total_time=60 -timeout=10 -max_len=65536 -rss_limit_mb=2048
