[workspace]
resolver = "3"
members = ["crates/riglet-format"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

# The evaluator and binding run on every load and frame. Optimize the format
# library even in dev builds (debug assertions stay on), so debug editors and
# tests see realistic load times.
[profile.dev.package.riglet-format]
opt-level = 2
